name: Régénérer les PDF (Print & Play et règles)
on:
  push:
    branches: [main]
    paths-ignore: ['pnp.pdf', 'regles.pdf']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/make_pdfs.py
      - name: Publier les PDF à jour
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pnp.pdf regles.pdf
          git diff --cached --quiet || (git commit -m "PDF régénérés automatiquement [skip ci]" && git push)
