<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empires — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: atelier de prototypage d'un eurogame antique — clair, concret, pour deux auteurs qui testent.
   IDEA: la table de jeu elle-même : plateau-roue, marché de cartes, ville 3x3, Merveilles.
   PICTURE: la roue d’expérience des ouvriers, grande, au centre du plateau du joueur actif.
   COLOUR and TYPE: pierre (ivoire/ardoise) + couleurs des tags (orange, rouge, vert, bleu) + violet Merveille ; Cinzel pour les titres, Source Sans 3 pour le texte.
   LAYOUT: barre d'onglets ; en jeu, Merveilles et marché en haut, plateau du joueur au milieu, adversaires et journal à côté. */
:root{color-scheme:light dark;
--bg:light-dark(#eadfc4,#1e1712);--panel:light-dark(#f8f0de,#2a2019);--panel2:light-dark(#f0e4c9,#352a20);
--ink:light-dark(#2b2116,#f0e6d2);--mute:light-dark(#6e5d45,#b9a888);--line:light-dark(#d2bd94,#4a3b2c);--brown:light-dark(#5d4a2f,#cdb38a);
--accentInk:light-dark(#6a1b9a,#c79be0);
--tex:radial-gradient(ellipse at 15% 10%,rgba(255,250,235,.7),transparent 45%),radial-gradient(ellipse at 85% 30%,rgba(214,186,130,.35),transparent 50%),radial-gradient(ellipse at 40% 90%,rgba(205,175,120,.3),transparent 55%);
--card:#fbf7ee;--cardink:#1f1c17;
--P:#e08a12;--M:#c62828;--S:#2e7d32;--C:#1e5aa8;--J:#8a8a8a;--W:#6a1b9a;--gold:#c9a227;--accent:#6a1b9a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--tex:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tex:none}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--tex),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;line-height:1.1;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(24px,3vw,32px)}h2{font-size:22px}h3{font-size:17px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select,input,textarea{min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px max(3vw,14px);border-bottom:3px double var(--brown)}
header h1{margin:0}header .sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 12px;text-decoration:none;color:var(--ink);font-family:Cinzel,serif;font-weight:700;font-size:15px;border-bottom:3px solid transparent}
nav a.on{border-bottom-color:var(--accentInk);color:var(--accentInk)}
main{padding:18px max(3vw,14px) 40px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 0 rgba(93,74,47,.15)}
/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(8px,2vw,24px) 0 28px}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(40px,7vw,76px);letter-spacing:.02em;margin:0;color:var(--brown)}
.hero .lead{font-size:clamp(18px,2vw,21px);max-width:34em;margin:.6em 0 1em}
.hero .by{font-family:Cinzel,serif;color:var(--mute);font-size:15px}
.board{position:relative;max-width:520px;width:100%;margin:auto;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(60,40,15,.55),0 0 0 6px #d8c49b,0 0 0 7px #8a7350}
.board img{display:block;width:100%;height:auto}
.board svg{position:absolute;inset:0;width:100%;height:100%}
@media(prefers-reduced-motion:no-preference){.board .hop{animation:hop 3.2s ease-in-out infinite}.board .hop:nth-of-type(2n){animation-delay:.8s}@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}}}
.icons{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.icons figure{margin:0;display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mute);width:72px;text-align:center}
.icons img{width:46px;height:46px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:22px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.step .num{width:44px;height:44px;border-radius:50%;background:var(--brown);color:var(--panel);display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;font-size:20px}
.step h3{margin:.1em 0 .2em}.step p{margin:0;color:var(--mute);font-size:15px}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.seat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:2px 8px}
.seat .seg,.seat .small{grid-column:1 / -1}
.seat.off{opacity:.55}
.seat svg{width:22px;height:24px}.seat svg path{stroke:var(--brown)}
.seat .sn{font-family:Cinzel,serif;font-weight:700;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;border-radius:0;min-height:36px;padding:4px 2px;font-size:13px;background:transparent}
.seg button.on{background:var(--brown);color:var(--panel);font-weight:700}
details.var summary{cursor:pointer;color:var(--mute);font-size:15px;padding:6px 0}
.tables li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tables{list-style:none;margin:0;padding:0}
.cta{text-decoration:none;padding:6px 14px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
#table button{min-height:32px;padding:3px 12px;font-size:14.5px;border-radius:7px}
#table .seg button{min-height:24px;padding:1px;font-size:12px;border-radius:0}
#table input{min-height:32px;padding:3px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.mute{color:var(--mute)}.small{font-size:14px}
.note{font-size:14px;color:var(--mute);margin:.4em 0}
label.f{display:grid;gap:4px;font-size:14px;color:var(--mute)}
/* cartes */
.card{background:var(--card);color:var(--cardink);border-radius:10px;border:2px solid #cfc6b4;width:224px;min-height:224px;flex:none;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.card.f-ag{border:3px solid #9aa4ae;box-shadow:inset 0 0 0 1px #e4e8ec}
.card.f-or{border:3px solid #c9a227;box-shadow:inset 0 0 0 1px #f3df9a}
.card.f-ag.sel,.card.f-or.sel{box-shadow:0 0 0 3px var(--accent)}
.zone{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;color:#1f1c17}.card .fx b.zone{color:#1f1c17}
.card.click{cursor:pointer}
.card .hd{display:flex;align-items:center;gap:6px;padding:5px 8px 4px}
.cz{display:flex;align-items:center;gap:3px;background:#efe4cc;border:1px solid #cfc6b4;border-radius:8px;padding:1px 5px 1px 2px;flex:none}
.czreq{display:flex;gap:1px;align-items:center;border-left:1px dashed #a8987a;padding-left:4px;margin-left:1px}
.czreq img{width:16px;height:16px;border-radius:3px}
.czgd{display:flex;align-items:center;font-weight:700;font-size:12px;color:#5d4a2f;border-left:1px dashed #a8987a;padding-left:4px}.czgd img{width:16px;height:16px;border-radius:3px}
.card .ft{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;margin-top:auto;border-top:1px solid #e2d8c4}
.gz{display:flex;align-items:center;gap:4px}
.card .nm{font-family:Cinzel,serif;font-weight:700;font-size:14px;line-height:1.1;flex:1}
.card .lv{font-size:11px;color:#6b6457}
.card svg.art{display:block;width:100%;height:74px}
.card .bar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.card .fx{padding:6px 8px 6px;font-size:12.5px;line-height:1.3;display:grid;gap:4px}
.card .fx b{font-size:10.5px;text-transform:none;letter-spacing:0;color:#fff;border-radius:4px;padding:0 5px;margin-right:4px;font-weight:700}
.k-req{background:#6a1b9a}.k-sx{background:#7a1f1f}.k-gd{background:#5d4a2f}
.gicon{width:20px;height:20px;border-radius:4px;flex:none}
.card.locked .art{filter:grayscale(.7) opacity(.7)}
.lockmsg{font-size:11.5px;color:#6a1b9a;font-weight:700;padding:0 8px}
.guildrows{display:grid;gap:6px;margin-top:10px}
.grow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.grow img{width:26px;height:26px;border-radius:5px}
.grow .gn{font-family:Cinzel,serif;font-weight:700;min-width:84px}.grow .chip{font-size:11.5px;padding:1px 7px;white-space:normal}
.k-imm{background:#c27d0e}.k-act{background:#455a64}.k-perm{background:#2e7d32}.k-end{background:#6a1b9a}.k-gui{background:#5d4a2f}
.card .gui{border-top:1px dashed #cfc6b4;padding-top:4px;color:#4a4337}
.tags{display:flex;gap:3px}
.tagi{width:22px;height:22px;display:block}
.retz{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px auto 0;padding:6px 10px;border:1px dashed var(--W);border-radius:10px;width:max-content;background:var(--panel2)}
.rslot{width:20px;height:22px}.rslot path{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:2 2}.rslot.on path{fill:#b07a3c;stroke:#3a2e1f;stroke-dasharray:none}
.tag{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:1.5px solid rgba(255,255,255,.7)}
.cost{display:flex;align-items:center;gap:2px}
.mcost{position:relative;width:30px;height:30px}
.mcost svg{width:30px;height:30px}
.mcost span{position:absolute;inset:7px 0 0;text-align:center;color:#fff;font-weight:700;font-size:13px}
.pv{background:url(img/pv.png) center/contain no-repeat;color:#1f6b1a;font-weight:800;width:30px;height:30px;display:inline-grid;place-items:center;font-size:13px;line-height:1;flex:none;vertical-align:middle;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.pv.sm{width:22px;height:22px;font-size:10.5px}.pv.lg{width:40px;height:40px;font-size:16px}
.pvi{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pvd{color:#1f6b1a;font-weight:800}td .pv,td .pvi{vertical-align:middle}#simOut td{vertical-align:middle}
.back{background:repeating-linear-gradient(45deg,#5d4a2f 0 8px,#6c573a 8px 16px);color:#f3ead7;display:grid;place-items:center;text-align:center;min-height:230px;padding:10px}
.back .big{font-family:Cinzel,serif;font-size:20px}
.gcard{width:120px;min-height:184px;flex:none;border-radius:8px;border:2px solid #5d4a2f;background:var(--card);color:var(--cardink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 8px}
.gcard img{width:40px;height:40px;border-radius:8px}.gcard .gn{font-family:Cinzel,serif;font-weight:700;font-size:13px}.gcard .gt{font-size:12.5px;line-height:1.3}
.gcard.click{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.cards{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.cards>*{scroll-snap-align:start}
/* plateau */
.table{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1000px){.table{grid-template-columns:minmax(0,1fr)}}
.wonders{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.wonder{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--W);border-radius:8px;padding:8px 10px;font-size:13px}
.wonder .wn{font-family:Cinzel,serif;font-weight:700;font-size:14px}
.slots{display:flex;gap:4px;margin-top:4px}
.slot{width:22px;height:22px;border-radius:5px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--mute)}
.me{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:720px){.me{grid-template-columns:minmax(0,1fr)}}
.wheel{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:auto}
.city{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{min-height:92px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:13px;background:var(--panel2);position:relative;overflow:hidden}
.cell.legal{border-color:var(--gold);border-style:solid;cursor:pointer;background:color-mix(in srgb,var(--gold) 18%,var(--panel2))}
.cell .mini{width:100%;height:100%;background:var(--card);color:var(--cardink);display:flex;flex-direction:column;padding:5px 6px;gap:2px;text-align:left}
.cell .mini .n{font-family:Cinzel,serif;font-weight:700;font-size:12.5px;line-height:1.1}
.cell .mini svg{width:100%;height:38px}
.cell.act{cursor:pointer}.cell.act .mini{box-shadow:inset 0 0 0 3px #455a64}
.occ{position:absolute;right:5px;bottom:5px;width:18px;height:18px}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.prompt{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.opp{display:grid;gap:10px}
.oppc{background:var(--panel2);border-radius:10px;padding:10px;border:1px solid var(--line)}
.oppc.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:1.5px solid #888}
.ow{display:flex;gap:3px;font-size:12px}
.ow span{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.minicity{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:6px}
.minicity div{height:22px;border-radius:3px;background:var(--panel);font-size:10px;line-height:22px;text-align:center;overflow:hidden;white-space:nowrap;padding:0 2px}
.log{font-size:13px;max-height:260px;overflow:auto;display:grid;gap:3px}
.log div{border-bottom:1px solid var(--line);padding-bottom:3px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.barrow{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.barrow i{display:block;height:100%}
.hot{color:#c62828;font-weight:700}.cold{color:#1e5aa8;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f1c17;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
.sortb{all:unset;cursor:pointer;font:inherit;font-weight:700;color:inherit;white-space:nowrap;padding:4px 2px;border-radius:4px}.sortb:hover{text-decoration:underline}.sortb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
th[aria-sort=ascending] .sortb,th[aria-sort=descending] .sortb{color:var(--gold)}
tr[data-hc],tr[data-hw]{cursor:help}tr[data-hc]:hover td,tr[data-hw]:hover td{background:rgba(201,162,39,.12)}
#hoverCard{position:fixed;z-index:60;display:none;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.wprev{width:240px;background:var(--card);color:var(--cardink);border:2px solid #cfc6b4;border-left:6px solid var(--W);border-radius:10px;padding:10px 12px}
.wprev .wtop{display:flex;align-items:center;gap:8px}.wprev .wn{font-family:Cinzel,serif;font-weight:700;font-size:16px}.wprev .wtx{font-size:13px;line-height:1.35;margin:8px 0}
.wprev .slots{display:flex;gap:6px}.pvslot{border:none!important;background:none!important;width:auto!important;height:auto!important}.wprev .slot{width:30px;height:30px;border-radius:50%;border:1.5px dashed #8a7a5c;display:grid;place-items:center;font-weight:700;font-size:13px;color:#2b2118;background:#fffaf0}
.edit input{width:64px;min-height:32px;padding:2px 6px;font-size:14px;background:#fffaf0;color:#2b2118;border:1px solid #b9a27a;color-scheme:light}
@media(prefers-reduced-motion:no-preference){.cell.legal{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{background:color-mix(in srgb,var(--gold) 30%,var(--panel2))}}}
</style>
</head>
<body>
<header>
  <div><h1 style="color:var(--brown)">Empires</h1><div class="sub">Prototype de Régis Crosnier &amp; Matthieu Verdier</div></div>
  <nav id="nav">
    <a href="#jouer" data-v="jouer">Accueil</a>
    <a href="#simulateur" data-v="simulateur">Atelier</a>
    <a href="#cartes" data-v="cartes">Cartes</a>
    <a href="#regles" data-v="regles">Règles</a>
  </nav>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="engine.js"></script>
<script>
{
const E = window.Empires;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SEATS = [{ n: 'Noir', c: '#2b2b2b' }, { n: 'Blanc', c: '#f4f1ea' }, { n: 'Rose', c: '#d63384' }, { n: 'Turquoise', c: '#0fa3a3' }];
const WOOD = '#b07a3c'; // ouvriers neutres, en bois
const TAGC = { P: 'var(--P)', M: 'var(--M)', S: 'var(--S)', C: 'var(--C)', J: 'var(--J)' };
const MEEPLE = 'M10 1c2.6 0 4.3 1.9 4.3 4.2 0 1.3-.5 2.4-1.4 3.2l5.2 1.9c1.2.4 1.6 1.8.9 2.8-.5.6-1.3.8-2 .5l-2.7-1 3 6.2c.4.9-.2 1.9-1.2 1.9h-3.2L10 15.9l-2.9 4.8H3.9c-1 0-1.6-1-1.2-1.9l3-6.2-2.7 1c-.7.3-1.5.1-2-.5-.7-1-.3-2.4.9-2.8l5.2-1.9C6.2 7.6 5.7 6.5 5.7 5.2 5.7 2.9 7.4 1 10 1z';

let view = 'jouer';
let db = null, user = null, me = null, canWrite = null, backend = null;
let overrides = {};
let G = null, mode = null; // mode: 'local' | 'online'
let seats = [];            // [{bot, uid, label}]
let undo = [];
let sel = null;            // {L, idx} carte du marché sélectionnée
let payMode = 'exact';
let online = { id: null, unsub: null, rev: 0, doc: null, writing: Promise.resolve() };
let lobby = [], names = {};
let botTimer = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Illustration simple d'un bâtiment ---------- */
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function art(card, h = 74) {
  const r = hash(card.name), main = Object.keys(card.t).sort((a, b) => card.t[b] - card.t[a])[0] || 'X';
  const col = { P: '#e08a12', M: '#c62828', S: '#2e7d32', C: '#1e5aa8', J: '#8a8a8a', X: '#7a6a55' }[main];

  } else if (main === 'S') { // dôme / observatoire

  } else if (main === 'C') { // temple

      ${Array.from({ length: n }, (_, i) => `<rect x="${x + 4 + i * (w - 14) / (n - 1)}" y="${y}" width="6" height="${h - 16 - y}" fill="${stone}" stroke="${dark}"/>`).join('')}
      <rect x="${x - 2}" y="${y - 6}" width="${w + 4}" height="6" fill="${stone}" stroke="${dark}"/>

  } else { // maison / arche

    b = `<rect x="${x}" y="${y}" width="${w}" height="26" fill="${stone}" stroke="${dark}"/>
      <path d="M${x - 5} ${y} L${cx} ${y - 18} L${x + w + 5} ${y} Z" fill="${col}" stroke="${dark}"/>
      <rect x="${x + w - 14}" y="${y - 16}" width="6" height="10" fill="${dark}"/>
      <path d="M${cx - 6} ${h - 10} v-10 a6 6 0 0 1 12 0 v10z" fill="${dark}"/>

  }

  const badges = extra.map((k, i) => `<circle cx="${18 + i * 14}" cy="16" r="5" fill="${TAGC[k].replace(/var\(--(\w)\)/, (m, t) => ({ P: '#e08a12', M: '#c62828', S: '#2e7d32', C: '#1e5aa8' }[t]))}"/>`).join('');
  return `<svg class="art" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${h}" fill="${sky}"/>${ground}${b}${badges}</svg>`;

function tagsHTML(t) {

function costHTML(card, cost) {

}
function meepleNum(v, color = '#5b4a36', stroke = '') { return `<div class="mcost"><svg viewBox="0 0 20 22"><path d="${MEEPLE}" fill="${color}"/></svg><span>${esc(v)}</span></div>`; }
// Icône de points de victoire : laurier avec la valeur en vert
function pvIcon(v, cls = '') {

  return `<span class="pv ${cls}" title="${v} PV" aria-label="${v} PV">${v}</span>`;

function cardHTML(card, o = {}) {

  const gi = card.g ? `<img class="gicon" src="img/${card.g}.png" alt="${esc(E.GUILD_NAMES[card.g])}" title="Guilde : ${esc(E.GUILD_NAMES[card.g])}${card.g === 'voy' ? ' (joker : rangée au choix)' : ''}">` : '';

    else Object.entries(card.req.tags).forEach(([k, n]) => { for (let i = 0; i < n; i++) reqI.push(`<img src="img/${ICON[k]}.png" alt="${E.TAG_NAMES[k]}" title="Prérequis : ${E.TAG_NAMES[k]}">`); });

/* ---------- Roue ---------- */
function wheelSVG(p, color, opts = {}) {
  // Même langage que les cartes : parchemin, encre brune, badges meeple chiffrés, or pour les points, violet Merveille
  const cx = 150, cy = 150, R = 116, ink = '#5b4a36', o = [];
  const fills = ['#e9e1cd', '#eedcbc', '#e8cfa6', '#dfe3e7', '#d2d8de', '#e8c75f']; // 1-2 bronze · 3-4 argent · 5 or
  const pt = (r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const f = n => n.toFixed(1);
  o.push(`<defs>
    <pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${fills[0]}"/><line x1="0" y1="0" x2="0" y2="6" stroke="#cfc3a8" stroke-width="2"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#7a5f3a" stop-opacity=".18"/></radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="${ink}"/></marker></defs>`);
  // anneau extérieur façon bord de carte
  o.push(`<circle cx="${cx}" cy="${cy}" r="${R + 16}" fill="#d8c49b" stroke="${ink}" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="${R + 9}" fill="none" stroke="#8a7350" stroke-width="1" stroke-dasharray="2 4"/>`);
  for (let i = 0; i < 6; i++) {
    const c = 180 + 60 * i, [x0, y0] = pt(R, c - 30), [x1, y1] = pt(R, c + 30);
    const pick = opts.pick && p.wheel[i] > 0;
    o.push(`<path d="M${cx} ${cy} L${f(x0)} ${f(y0)} A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)} Z" fill="${i === 0 ? 'url(#hz)' : fills[i]}" stroke="${pick ? '#c9a227' : ink}" stroke-width="${pick ? 4 : 2}" ${pick ? `data-lvl="${i}" style="cursor:pointer" tabindex="0" role="button" aria-label="Choisir un ouvrier de niveau ${i}"` : ''}/>`);
    // ouvriers rangés sur deux arcs
    const n = p.wheel[i], slots = [[52, -16], [52, 16], [86, -18], [86, 0], [86, 18], [52, 0]];
    for (let k = 0; k < Math.min(n, 6); k++) {
      const [mx, my] = pt(slots[k][0], c + slots[k][1]);
      o.push(`<path d="${MEEPLE}" transform="translate(${f(mx - 10)} ${f(my - 11)})" fill="${color}" stroke="${ink}" stroke-width="1.4" pointer-events="none"/>`);
    }
    if (n > 6) { const [bx, by] = pt(104, c); o.push(`<g pointer-events="none"><circle cx="${f(bx)}" cy="${f(by)}" r="10" fill="${ink}"/><text x="${f(bx)}" y="${f(by + 4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fbf7ee">×${n}</text></g>`); }
    // badge de niveau : meeple chiffré, comme le coût des cartes
    const [lx, ly] = pt(R + 16, c);
    o.push(`<g pointer-events="none"><circle cx="${f(lx)}" cy="${f(ly)}" r="14" fill="${i === 5 ? '#c9a227' : i >= 3 ? '#7d8792' : ink}" stroke="#fbf7ee" stroke-width="2"/>
      <text x="${f(lx)}" y="${f(ly + 5.5)}" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-weight="700" font-size="16" fill="${i === 5 ? '#1f1c17' : '#fbf7ee'}">${i}</text></g>`);
  }
  o.push(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#glow)" pointer-events="none"/>`);
  // sens de rotation
  for (const d of [-60, 60]) { const [ax, ay] = pt(R + 30, d - 10), [bx, by] = pt(R + 30, d + 10); o.push(`<path d="M${f(ax)} ${f(ay)} A${R + 30} ${R + 30} 0 0 1 ${f(bx)} ${f(by)}" fill="none" stroke="${ink}" stroke-width="2" marker-end="url(#ah)" opacity=".6"/>`); }
  // sortie vers les Merveilles, entre les cases 5 et 0
  const [ex, ey] = pt(R + 24, 150), [wx, wy] = pt(R + 44, 160);
  o.push(`<path d="M${f(ex)} ${f(ey)} Q${f(ex - 18)} ${f(ey + 4)} ${f(wx + 10)} ${f(wy - 10)}" fill="none" stroke="${ink}" stroke-width="2.5" marker-end="url(#ah)"/>
    <g transform="translate(${f(wx - 12)} ${f(wy - 12)})"><rect width="24" height="24" rx="4" fill="#6a1b9a" stroke="#fbf7ee" stroke-width="1.5"/><path d="M12 5 l8 14 h-16z" fill="#f5e9c8"/><path d="M6 19 h12" stroke="#6a1b9a" stroke-width="1"/></g>`);
  // moyeu
  o.push(`<circle cx="${cx}" cy="${cy}" r="20" fill="${ink}" stroke="#c9a227" stroke-width="3"/>
    <path d="M${cx - 9} ${cy + 2} a9 9 0 1 1 6 7" fill="none" stroke="#fbf7ee" stroke-width="2.2" marker-end="url(#ah2)"/>
    <defs><marker id="ah2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#fbf7ee"/></marker></defs>`);
  return `<svg class="wheel" viewBox="-22 -22 344 344" role="img" aria-label="Roue des ouvriers : ${p.wheel.map((n, l) => `${n} au niveau ${l}`).join(', ')}">${o.join('')}</svg>`;
}
/* ---------- Routage ---------- */
function route() {
  const h = location.hash.replace('#', '');
  if (h === 'table') { view = 'jouer'; document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view)); if (!$('#table')) render(); $('#table') && $('#table').scrollIntoView({ behavior: 'smooth' }); return; }
  view = ['jouer', 'simulateur', 'cartes', 'regles'].includes(h) ? h : 'jouer';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  render();
}
window.addEventListener('hashchange', route);

function render() {
  const app = $('#app');
  if (view === 'jouer') app.innerHTML = G ? gameHTML() : setupHTML();
  else if (view === 'simulateur') { app.innerHTML = simHTML(); restoreSimForm(); }
  else if (view === 'cartes') app.innerHTML = cardsHTML();
  else app.innerHTML = rulesHTML();
  if (view === 'jouer' && G) resolveNames();
}

function act(a) {

}

    seats: s.map((x, k) => ({ si: x.i, bot: x.bot, uid: !x.bot && k === 0 ? me : null })), state: null, rev: 0 };

}

function runSim() {
  keepSimForm();
  const n = +$('#snp').value, N = +$('#sng').value;
  const sw = $('#ssw').value.split(',').map(x => +x || 0).slice(0, 6); while (sw.length < 6) sw.push(0);
  const opts = Object.assign(readOpts('s'), { startWheel: sw });
  const sig = JSON.stringify([n, opts, overrides]);
  const fresh = !(simRes && simRes.sig === sig);
  const R = fresh ? { n, sig, N: 0, next: 0, opts, games: [], cs: {}, wond: {} } : simRes; // mêmes réglages : on cumule
  const before = R.N;
  simRunning = true; $('#runSim').disabled = true; $('#runSim').textContent = 'Simulation…'; $('#resetSim').disabled = true;
  let s = 0;
  const step = () => {
    const t0 = performance.now();
    while (s < N && performance.now() - t0 < 120) {
      const g = E.newGame(Array.from({ length: n }, (_, i) => SEATS[i].n), opts, 1000 + (R.next++) * 7919);
      let guard = 0; try { while (!g.over && guard++ < 3000) E.botTurn(g); } catch (e) { console.warn('Partie interrompue', e); }
      collect(R, g); s++;
    }
    $('#simProg').textContent = `${s} / ${N} parties${before ? ` (en plus des ${before} déjà cumulées)` : fresh && simRes ? ' (réglages changés : nouvelles statistiques)' : ''}`;
    if (s < N) setTimeout(step, 0);
    else { simRunning = false; simRes = R; saveSim(); if (view === 'simulateur') render(); }
  };
  setTimeout(step, 10);
}
function collect(R, g) {
  if (!g.over) return; R.N++;
  const win = g.winner;
  R.games.push({ rounds: g.round - 1, reason: g.endReason, win, final: g.final.map(f => ({ total: f.total, bat: f.bat, fin: f.fin, wond: f.wond, tokens: f.tokens })), st: g.players.map(p => ({ built: p.st.built, guild: p.st.guild, ejected: p.st.ejected })),
    gcards: g.players.reduce((a, p) => a + (p.guilds ? E.GUILDS.reduce((b, k) => b + p.guilds[k].length, 0) : 0), 0) / g.players.length,
    l2: Object.entries(g.cs || {}).filter(([k]) => k[0] === 'b').reduce((a, [, v]) => a + v.b, 0) / g.players.length });
  for (const id in g.cs || {}) { const c = (R.cs[id] = R.cs[id] || { b: 0, g: 0, held: 0, wins: 0 }); c.b += g.cs[id].b; c.g += g.cs[id].g; }
  g.players.forEach((p, i) => p.grid.forEach(cell => { if (cell) { const c = (R.cs[cell.id] = R.cs[cell.id] || { b: 0, g: 0, held: 0, wins: 0 }); c.held++; if (i === win) c.wins++; } }));
  const W0 = () => ({ games: 0, placed: 0, pts: 0, first: 0, firstN: 0, wins: 0 });
  g.wonders.forEach(w => { const x = (R.wond[w.id] = R.wond[w.id] || W0()); x.games++; x.placed += w.slots.length; if (w.slots.includes(win)) x.wins = (x.wins || 0) + 1; });
  for (const [id, slot, pts] of g.wst || []) { const x = (R.wond[id] = R.wond[id] || W0()); x.pts = (x.pts || 0) + pts; if (slot === 0) { x.first = (x.first || 0) + pts; x.firstN = (x.firstN || 0) + 1; } }
}

  else { try { localStorage.setItem('empires-ov', JSON.stringify(ov)); } catch (e) { } toast('Réglages enregistrés dans ce navigateur.'); }

function copy(text) { navigator.clipboard.writeText(text).then(() => toast('Copié.'), () => toast('Copie refusée par le navigateur.')); }
function csv() {
  const head = ['id', 'nom', 'niveau', 'guilde', 'tags', 'valeur', 'niveaux', 'PV', 'prérequis', 'réduction guilde', 'immédiat', 'activation', 'permanent', 'fin', 'effet de guilde'];
  const lines = E.CARDS.map(c => { const t = E.cardText(c); return [c.id, c.name, c.lvl, E.GUILD_NAMES[c.g] || '', Object.entries(c.t).map(([k, v]) => k.repeat(v)).join(''), E.cardValue(c), c.c.join('+'), c.pv, t.req || '', c.gd ? 'oui' : '', t.imm || '', t.act || '', t.perm || '', t.end || '', t.disc].join('\t'); });
  return [head.join('\t')].concat(lines).join('\n');
}

/* ---------- Règles ---------- */
function rulesHTML() {
  return `<section class="panel" style="max-width:860px">
  <h2>Règles telles que l’app les joue</h2>
  <p>Version B (coûts en chiffre dans un meeple, effet de guilde), avec les décisions prises dans la discussion. Les points marqués <strong>Hypothèse</strong> sont des choix faits pour rendre le jeu jouable, à valider ou à changer.</p>
  <h3>Mise en place</h3>
  <p>Chaque joueur commence avec 5 ouvriers en bois sur sa roue (2 au niveau 0, 2 au niveau 1, 1 au niveau 2). Tous les autres ouvriers forment la réserve générale, commune. Chaque joueur a des marqueurs à sa couleur pour les Merveilles. Marché : 4 bâtiments visibles de niveau 1 et 4 de niveau 2, et une rangée de 4 cartes de guilde visibles (paquet séparé de 66 petites cartes). Merveilles : nombre de joueurs + 2, tirées au hasard parmi 16, en rangée au-dessus des bâtiments de niveau 2.</p>
  <h3>Tour de jeu</h3>
  <p><strong>Chaque tour se joue en deux temps :</strong></p>
  <ul><li><strong>1. Prenez une carte de guilde</strong> parmi les 4 visibles et appliquez son effet. Les cartes de guilde forment un paquet à part de petites cartes (41 × 63 mm) : Artisans (faire progresser des ouvriers), Marchands (gagner des ouvriers), Érudits (gagner des Plans) et Voyageurs (joker : un effet au choix, rangée au choix). Rangez la carte à gauche de votre plateau, dans la rangée de sa guilde. Il n’y a pas de cascade : seule la nouvelle carte agit. <strong>Garde-fou</strong> : si l’effet ne peut pas s’appliquer (case 0 pleine, roue vide), prenez 1 Plan à la place. <strong>Plan</strong> : jeton qui réduit de 1 le coût de votre prochaine construction ; utilisé automatiquement, il ne vaut aucun point. Vos rangées de guilde servent aux réductions de guilde et à certains scores de bâtiments (Forum, Grand marché, Comptoir).</li>
  <li><strong>2. Puis, au choix : construisez un bâtiment</strong> (prenez une carte visible, payez son coût, posez-la dans votre ville à droite du plateau ; le marché est complété aussitôt) <strong>ou tournez votre roue d’un cran</strong>.</li></ul>
  <p><strong>À 2 joueurs</strong>, le second joueur commence avec 1 Plan.</p>

  <h3>Payer un bâtiment</h3>
  <p>Le coût est un chiffre, en haut à gauche de la carte. Dépensez des ouvriers de votre roue dont la somme des niveaux atteint ce chiffre ; un ouvrier de niveau 0 ne vaut rien. Il est interdit d’ajouter un ouvrier inutile. <strong>Les ouvriers dépensés retournent au niveau 0 de votre roue</strong> : payer, c’est perdre l’expérience de ses ouvriers, pas les ouvriers eux-mêmes. Exception : les bâtiments marqués <strong>Sacrifice</strong> (à cadre or) font quitter la roue aux ouvriers dépensés. Les réductions (Plans, guildes, bâtiments) s’appliquent au chiffre.</p>
  <h3>Pourquoi ce tour de jeu</h3>
  <p>Avec l’ancien tour (guilde ou construction), les simulations donnaient environ 10 actions de guilde pour 5 à 6 bâtiments. Avec « une carte de guilde, puis construire ou tourner la roue », on construit environ deux tours sur trois : 9 à 10 tours et 6 à 7 bâtiments par joueur, et la partie se termine tantôt par les Merveilles, tantôt par une ville complète. Les bâtiments et les guildes sont deux paquets séparés : personne ne peut vous prendre un bâtiment en guilde.</p>
  <h3>Conditions sur les cartes (une seule par carte)</h3>
  <p><strong>Réduction de guilde</strong> (quelques cartes) : le bâtiment coûte 1 de moins par carte de sa guilde dans votre rangée, 3 de moins au maximum. <strong>Prérequis de tags</strong> (la plupart des cartes de niveau 2) : il faut déjà avoir ces tags dans sa ville ; le Joker ne compte pas. <strong>Prérequis Merveille</strong> (les cartes les plus fortes) : avoir au moins 1 marqueur sur une Merveille. Les cartes à prérequis coûtent 1 de moins qu’avant ; les cartes à réduction de guilde coûtent 2 de plus, pour que la réduction soit un vrai avantage.</p>
  <p><strong>Nombre de cartes</strong> : 45 bâtiments de niveau 1 et 40 de niveau 2 (cartes carrées de 7 × 7 cm, un exemplaire de chacun), 66 cartes de guilde (41 × 63 mm) et 16 Merveilles. Si les cartes de guilde ou la pioche de niveau 1 sont épuisées, la fin de partie est déclenchée.</p><p><strong>Les quatre tags</strong> ont chacun leur style : <strong>Prospérité</strong> fait grandir la population (gagner des ouvriers), <strong>Militaire</strong> forme des vétérans (ouvriers de haut niveau, zone de retraite, marqueurs), <strong>Science</strong> fait tourner le moteur (progression, roue, réductions, effets permanents), <strong>Culture</strong> marque des points (placement dans la ville, lignes, colonnes, voisins). Une carte porte un tag, deux fois le même, deux tags différents, aucun, ou très rarement les quatre (Palais).</p>
  <h3>Cadres argent et or</h3>
  <p>La roue a trois zones : <strong>bronze</strong> (niveaux 1-2), <strong>argent</strong> (3-4) et <strong>or</strong> (5). Un bâtiment à cadre argent se paie avec au moins un ouvrier de niveau 3 ou plus ; à cadre or, avec au moins un ouvrier de niveau 5. Plusieurs jeunes ouvriers ne suffisent pas. Le reste du coût se complète normalement. Les cadres touchent quelques cartes de niveau 1 (Marché, Palissade, Caserne en argent ; Ferme, Villa en or) et la plupart des grandes cartes de niveau 2 (Trésor royal, Fortifications, Académie, Panthéon, Palais en or). Un ouvrier en zone or est donc tiraillé : il peut payer un grand bâtiment, ou partir à la retraite sur une Merveille.</p>
  <h3>Ville</h3>
  <p>Grille 3 × 3. Le premier bâtiment se place n’importe où, les suivants à côté d’un bâtiment existant. Le placement compte : certains bâtiments marquent selon leur ligne, leur colonne, leurs voisins ou leur position dans un coin, et l’Étude redéclenche l’effet immédiat de ses voisins.</p>
  <h3>La roue</h3>
  <p><strong>Un cycle continu.</strong> Un ouvrier qui entre sur votre roue y reste. « Tournez votre roue » fait avancer tous vos ouvriers d’une case. Un ouvrier qui dépasse le niveau 5 part à la retraite, et vous choisissez : soit il revient tout de suite au niveau 0, soit il attend dans la <strong>zone de retraite</strong> de votre plateau (2 emplacements). Quand elle est pleine, vous posez un marqueur sur une Merveille de votre choix (place libre la plus à gauche), puis les 2 ouvriers reviennent ensemble au niveau 0. Pendant leur attente, ils ne servent à rien. « Gagnez un ouvrier de niveau 0 » en prend un dans la réserve générale, s’il y a moins de 3 ouvriers dans votre case 0 ; sinon, le garde-fou des guildes donne un Plan. Un ouvrier gagné à un niveau supérieur n’a pas cette limite. On ne perd des ouvriers qu’avec les bâtiments Sacrifice.</p>
  <p>Le Joker compte comme le type manquant pour « 1 tag de chaque type », et comme un type de plus pour « tags différents ».</p>
  <h3>Merveilles et fin de partie</h3>
  <p>Chaque Merveille a 3 places de valeur dégressive. Par défaut, les points sont comptés <strong>à l’arrivée de l’ouvrier</strong>, avec vos tags à ce moment-là (option : en fin de partie). Un joueur ne peut avoir qu’un seul marqueur par Merveille. Si aucune place ne lui est accessible, aucun marqueur n’est posé. La fin est déclenchée quand il y a 2 marqueurs par joueur sur les Merveilles, ou quand une ville atteint 9 bâtiments. On termine alors le tour de table. Égalité : le plus d’ouvriers sur la roue.</p>
  <h3>Équilibrage</h3>
  <p>Réglé sur des parties simulées entre bots qui planifient leur tour : environ 9 à 10 tours et 6 à 7 bâtiments par joueur, un score gagnant proche de 42 PV, et une fin par les Merveilles dans environ 4 parties sur 10 (les autres par une ville complète), à 2, 3 et 4 joueurs. <strong>Idées retirées</strong> pour alléger le jeu : l’activation d’un bâtiment en y posant un ouvrier (très peu utilisée ; ces effets sont devenus des effets immédiats), les effets « reprenez un ouvrier », les jetons Bonus (remplacés par des PV), le déblocage d’ouvriers (remplacé par « gagnez un ouvrier de niveau 2 »). Cartes atypiques conservées : la Grue (un bâtiment de niveau 2 peut la recouvrir) et quatre cartes « si vous avez 1 tag de chaque type ».</p>
  <h3>Questions encore ouvertes</h3>
  <ul><li>Roue de départ (5 ouvriers : 2 au niveau 0, 2 au niveau 1, 1 au niveau 2).</li><li>Valeur des Merveilles, non réglées une par une.</li><li>Les bots jouent correctement mais pas comme des experts : tout est à confirmer en vraies parties.</li></ul>
  </section>`;
}

function hashStr(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) | 0; return String(h >>> 0); }
async function syncSheet(auto) {
  if (syncing) return; const c = window.claude; if (!c || !c.use) return;
  const mcp = await c.use('mcp');
  if (!mcp) { sheetSync = { state: 'off', msg: 'Synchronisation indisponible dans cette vue.' }; if (view === 'cartes') render(); return; }
  const T = sheetTables(), hash = hashStr(JSON.stringify(T));
  if (auto && db) { try { const s = await db.doc('config/sheet').get(); if (s.exists && s.data().hash === hash) { sheetSync = { state: 'ok', at: s.data().at, msg: '' }; if (view === 'cartes') render(); return; } } catch (e) { } }
  syncing = true; sheetSync = { state: 'busy', msg: '' }; if (view === 'cartes') render();
  try {
    for (const [tab, rows] of Object.entries(T)) {
      await mcp.callTool(SHEET_SERVER, 'batch_clear_values', { spreadsheetId: SHEET_ID, ranges: [`'${tab}'!A2:Z1000`] });
      await mcp.callTool(SHEET_SERVER, 'update_values', { spreadsheetId: SHEET_ID, range: `'${tab}'!A1`, values: rows });
    }
    const at = Date.now(); sheetSync = { state: 'ok', at, msg: '' };
    if (db) { try { await db.doc('config/sheet').set({ hash, at }); } catch (e) { } }
  } catch (e) {
    const fix = { needs_reauth: 'Reconnectez Google Sheets dans les réglages de claude.ai (Connecteurs).', server_not_connected: 'Ajoutez le connecteur Google Sheets dans les réglages de claude.ai (Connecteurs).', not_in_manifest: 'Vous avez refusé l’accès à Google Sheets pour cette page.', approval_required: 'La synchronisation attend votre autorisation : cliquez sur « Synchroniser maintenant ».', tool_error: 'Google Sheets a refusé l’écriture (droits sur le tableur ?).', selection_required: 'Choisissez quel connecteur Google Sheets utiliser.' }[e && e.code];
    sheetSync = { state: 'err', msg: fix || ('Synchronisation interrompue (' + ((e && e.code) || 'erreur') + ').') };
  }
  syncing = false; if (view === 'cartes') render();
}
