<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Roue des Vies — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: atelier de prototypage d'un eurogame antique — clair, concret, pour deux auteurs qui testent.
   IDEA: la table de jeu elle-même : plateau-roue, marché de cartes, mandala 3x3, Sanctuaires.
   PICTURE: la roue d’expérience des âmes, grande, au centre du plateau du joueur actif.
   COLOUR and TYPE: pierre (ivoire/ardoise) + couleurs des tags (orange, rouge, vert, bleu) + violet Sanctuaire ; Cinzel pour les titres, Source Sans 3 pour le texte.
   LAYOUT: barre d'onglets ; en jeu, Sanctuaires et marché en haut, plateau du joueur au milieu, adversaires et journal à côté. */
:root{color-scheme:light dark;
--bg:light-dark(#efe2c2,#1d1512);--panel:light-dark(#f8f0de,#2a2019);--panel2:light-dark(#f0e4c9,#352a20);
--ink:light-dark(#2b2116,#f0e6d2);--mute:light-dark(#6e5d45,#b9a888);--line:light-dark(#d2bd94,#4a3b2c);--brown:light-dark(#5d4a2f,#cdb38a);
--accentInk:light-dark(#9b2226,#f0a39a);
--tex:radial-gradient(ellipse at 15% 10%,rgba(255,250,235,.7),transparent 45%),radial-gradient(ellipse at 85% 30%,rgba(214,186,130,.35),transparent 50%),radial-gradient(ellipse at 40% 90%,rgba(205,175,120,.3),transparent 55%);
--card:#fbf7ee;--cardink:#1f1c17;
--P:#d98e04;--M:#b3261e;--S:#2e7d5b;--C:#2b5aa8;--J:#8a8a8a;--W:#6d3b8e;--gold:#c9a227;--accent:#9b2226}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--tex:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tex:none}}
*{box-sizing:border-box;min-width:0}
h1,h2,h3,.nm,.logo,.wn,.gn,.sn,.mx-g{font-synthesis:none}
body{margin:0;background:var(--tex),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;line-height:1.1;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(24px,3vw,32px)}h2{font-size:22px}h3{font-size:17px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select,input,textarea{min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px max(3vw,14px);border-bottom:3px double var(--brown)}
header h1{margin:0}header .sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 12px;text-decoration:none;color:var(--ink);font-family:'Yatra One',serif;font-weight:700;font-size:15px;border-bottom:3px solid transparent}
nav a.on{border-bottom-color:var(--accentInk);color:var(--accentInk)}
main{padding:18px max(3vw,14px) 40px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 0 rgba(93,74,47,.15)}
/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(8px,2vw,24px) 0 28px}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(40px,7vw,76px);letter-spacing:.02em;margin:0;color:var(--brown)}
.hero .lead{font-size:clamp(18px,2vw,21px);max-width:34em;margin:.6em 0 1em}
.hero .by{font-family:'Yatra One',serif;color:var(--mute);font-size:15px}
.board{position:relative;max-width:520px;width:100%;margin:auto;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(60,40,15,.55),0 0 0 6px #d8c49b,0 0 0 7px #8a7350}
.board img{display:block;width:100%;height:auto}
.board svg{position:absolute;inset:0;width:100%;height:100%}
@media(prefers-reduced-motion:no-preference){.board .hop{animation:hop 3.2s ease-in-out infinite}.board .hop:nth-of-type(2n){animation-delay:.8s}@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}}}
.icons{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.icons figure{margin:0;display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mute);width:72px;text-align:center}
.icons img{width:46px;height:46px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:22px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.step .num{width:44px;height:44px;border-radius:50%;background:var(--brown);color:var(--panel);display:grid;place-items:center;font-family:'Yatra One',serif;font-weight:700;font-size:20px}
.step h3{margin:.1em 0 .2em}.step p{margin:0;color:var(--mute);font-size:15px}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.seat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:2px 8px}
.seat .seg,.seat .small{grid-column:1 / -1}
.seat.off{opacity:.55}
.seat svg{width:22px;height:24px}.seat svg path{stroke:var(--brown)}
.seat .sn{font-family:'Yatra One',serif;font-weight:700;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;border-radius:0;min-height:36px;padding:4px 2px;font-size:13px;background:transparent}
.seg button.on{background:var(--brown);color:var(--panel);font-weight:700}
details.var summary{cursor:pointer;color:var(--mute);font-size:15px;padding:6px 0}
.tables li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tables{list-style:none;margin:0;padding:0}
.cta{text-decoration:none;padding:6px 14px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
#table button{min-height:32px;padding:3px 12px;font-size:14.5px;border-radius:7px}
#table .seg button{min-height:24px;padding:1px;font-size:12px;border-radius:0}
#table input{min-height:32px;padding:3px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.mute{color:var(--mute)}.small{font-size:14px}
.note{font-size:14px;color:var(--mute);margin:.4em 0}
label.f{display:grid;gap:4px;font-size:14px;color:var(--mute)}
/* cartes */
.card{background:var(--card);color:var(--cardink);border-radius:10px;border:2px solid #cfc6b4;width:224px;min-height:224px;flex:none;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.card.f-ag{border:3px solid #d99a2b;box-shadow:inset 0 0 0 1px #f6dca6}
.card.f-or{border:3px solid #c9a227;box-shadow:inset 0 0 0 1px #f3df9a}
.card.f-br{border:3px solid #6fae4f;box-shadow:inset 0 0 0 1px #d5ebc0}
.zone.age{display:inline-flex;align-items:center;gap:3px}.zone.age img{width:13px;height:13px}
.card.f-ag.sel,.card.f-or.sel,.card.f-br.sel{box-shadow:0 0 0 3px var(--accent)}
.zone{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;color:#1f1c17}.card .fx b.zone{color:#1f1c17}
.card.click{cursor:pointer}
.card.can{outline:3px solid #2e8b3a;outline-offset:1px}.card.can.sel{outline-color:var(--accent)}
.card.cant .art,.card.cant .fx,.card.cant .ft{opacity:.55}
.canmsg.byp{background:#1565c0}
.canmsg{background:#2e8b3a;color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:2px 4px}
.card .hd{display:flex;align-items:center;gap:6px;padding:5px 8px 4px}
.cz{display:flex;align-items:center;gap:3px;background:#efe4cc;border:1px solid #cfc6b4;border-radius:8px;padding:1px 5px 1px 2px;flex:none}
.czreq{display:flex;gap:1px;align-items:center;border-left:1px dashed #a8987a;padding-left:4px;margin-left:1px}
.czreq img{width:16px;height:16px;border-radius:3px}
.czgd{display:flex;align-items:center;font-weight:700;font-size:12px;color:#5d4a2f;border-left:1px dashed #a8987a;padding-left:4px}.czgd img{width:16px;height:16px;border-radius:3px}
.card .ft{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;margin-top:auto;border-top:1px solid #e2d8c4}
.gz{display:flex;align-items:center;gap:4px}
.card .nm{font-family:'Yatra One',serif;font-weight:700;font-size:14px;line-height:1.1;flex:1}
.card .lv{font-size:11px;color:#6b6457}
.card svg.art{display:block;width:100%;height:74px}
.card .bar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.card .fx{padding:6px 8px 6px;font-size:12.5px;line-height:1.3;display:grid;gap:4px}
.card .fx b{font-size:10.5px;text-transform:none;letter-spacing:0;color:#fff;border-radius:4px;padding:0 5px;margin-right:4px;font-weight:700}
.k-req{background:#6d3b8e}.k-sx{background:#7a1f1f}.k-gd{background:#5d4a2f}
.gicon{width:20px;height:20px;border-radius:4px;flex:none}
.card.locked .art{filter:grayscale(.7) opacity(.7)}
.lockmsg{font-size:11.5px;color:#7a2a6e;font-weight:700;padding:0 8px}
.guildrows{display:grid;gap:6px;margin-top:10px}
.matrix{display:grid;gap:3px;margin-top:10px;font-size:11.5px;align-items:stretch}
.mx-h{text-align:center;font-weight:700;color:var(--mute);font-size:11px}
.mx-g{display:flex;align-items:center;gap:5px;font-family:'Yatra One',serif;font-weight:700;font-size:12px;white-space:nowrap;padding-right:4px}.mx-g img{width:20px;height:20px;border-radius:4px}.mx-f{font-family:inherit;font-weight:400;color:var(--mute);font-size:11px}
.mx-s{border:1px dashed var(--line);border-radius:5px;text-align:center;padding:4px 1px;color:var(--mute);white-space:nowrap;min-width:0;overflow:hidden}
.mx-s.on{border:1px solid #5d4a2f;background:var(--card);color:var(--cardink);font-weight:700}
.mx-s.next{border:2px solid var(--gold);color:var(--ink)}
.mx-c{text-align:center;color:var(--line);font-size:14px;line-height:1.2}.mx-c.on{color:#2e8b3a;font-weight:700}
.bless{display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px}.bgrp{display:inline-flex;align-items:center;gap:1px}.bgrp b{font-size:14px;color:#2e7d5b}.mx-s .bgrp b{font-size:11px}.bico{display:inline-block;vertical-align:middle;flex:none}.mx-s{display:flex;align-items:center;justify-content:center}
.colb{color:#1f6b1a;font-weight:700;font-size:11.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.grow img{width:26px;height:26px;border-radius:5px}
.grow .gn{font-family:'Yatra One',serif;font-weight:700;min-width:84px}.grow .chip{font-size:11.5px;padding:1px 7px;white-space:normal}
.k-imm{background:#c27d0e}.k-act{background:#455a64}.k-perm{background:#2e7d32}.k-end{background:#6d3b8e}.k-gui{background:#5d4a2f}
.card .gui{border-top:1px dashed #cfc6b4;padding-top:4px;color:#4a4337}
.tags{display:flex;gap:3px}
.tagi{width:22px;height:22px;display:block}
.retz{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px auto 0;padding:6px 10px;border:1px dashed var(--W);border-radius:10px;width:max-content;background:var(--panel2)}
.rslot{width:20px;height:22px}.rslot path{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:2 2}.rslot.on path{fill:#b07a3c;stroke:#3a2e1f;stroke-dasharray:none}
.tag{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:1.5px solid rgba(255,255,255,.7)}
.cost{display:flex;align-items:center;gap:2px}
.mcost{position:relative;width:30px;height:30px}
.mcost svg{width:30px;height:30px}
.mcost span{position:absolute;inset:10px 0 0;text-align:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 0 2px rgba(0,0,0,.35)}
.pv{background:url(img/pv.svg) center/contain no-repeat;color:#1f6b1a;font-weight:800;width:30px;height:30px;display:inline-grid;place-items:center;font-size:13px;line-height:1;flex:none;padding-top:9%;box-sizing:border-box;vertical-align:middle;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.pv.sm{width:22px;height:22px;font-size:10.5px}.pv.lg{width:40px;height:40px;font-size:16px}
.pvi{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pvd{color:#1f6b1a;font-weight:800}td .pv,td .pvi{vertical-align:middle}#simOut td{vertical-align:middle}
.back{background:repeating-linear-gradient(45deg,#5d4a2f 0 8px,#6c573a 8px 16px);color:#f3ead7;display:grid;place-items:center;text-align:center;min-height:230px;padding:10px}
.back .big{font-family:'Yatra One',serif;font-size:20px}
.gcard{width:120px;min-height:140px;flex:none;border-radius:8px;border:2px solid #5d4a2f;background:var(--card);color:var(--cardink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 8px}
.gcard img{width:40px;height:40px;border-radius:8px}.gcard .gn{font-family:'Yatra One',serif;font-weight:700;font-size:13px}.gcard .gt{font-size:12.5px;line-height:1.3}
.gcard.click{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.cards{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.cards>*{scroll-snap-align:start}
/* plateau */
.table{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1000px){.table{grid-template-columns:minmax(0,1fr)}}
.wonders{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.wonder{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--W);border-radius:8px;padding:8px 10px;font-size:13px}
.wonder .wn{font-family:'Yatra One',serif;font-weight:700;font-size:14px}
.slots{display:flex;gap:4px;margin-top:4px}
.slot{width:22px;height:22px;border-radius:5px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--mute)}
.me{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:720px){.me{grid-template-columns:minmax(0,1fr)}}
.wheel{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:auto}
.city{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{min-height:92px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:13px;background:var(--panel2);position:relative;overflow:hidden}
.cell.legal{border-color:var(--gold);border-style:solid;cursor:pointer;background:color-mix(in srgb,var(--gold) 18%,var(--panel2))}
.cell .mini{width:100%;height:100%;background:var(--card);color:var(--cardink);display:flex;flex-direction:column;padding:5px 6px;gap:2px;text-align:left}
.cell .mini .n{font-family:'Yatra One',serif;font-weight:700;font-size:12.5px;line-height:1.1}
.cell .mini svg{width:100%;height:38px}
.cell[data-hc]{cursor:help}.cell[data-hc]:hover .mini,.cell[data-hc]:focus-visible .mini{box-shadow:inset 0 0 0 3px var(--gold)}.cell.legal[data-hc]{cursor:pointer}
.cell.act{cursor:pointer}.cell.act .mini{box-shadow:inset 0 0 0 3px #455a64}
.occ{position:absolute;right:5px;bottom:5px;width:18px;height:18px}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.prompt{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.opp{display:grid;gap:10px}
.oppc{background:var(--panel2);border-radius:10px;padding:10px;border:1px solid var(--line)}
.oppc.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:1.5px solid #888}
.ow{display:flex;gap:3px;font-size:12px}
.ow span{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.minicity{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:6px}
.minicity div{height:22px;border-radius:3px;background:var(--panel);font-size:10px;line-height:22px;text-align:center;overflow:hidden;white-space:nowrap;padding:0 2px}
.log{font-size:13px;max-height:260px;overflow:auto;display:grid;gap:3px}
.log div{border-bottom:1px solid var(--line);padding-bottom:3px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.barrow{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.barrow i{display:block;height:100%}
.hot{color:#c62828;font-weight:700}.cold{color:#1e5aa8;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f1c17;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
.sortb{all:unset;cursor:pointer;font:inherit;font-weight:700;color:inherit;white-space:nowrap;padding:4px 2px;border-radius:4px}.sortb:hover{text-decoration:underline}.sortb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
th[aria-sort=ascending] .sortb,th[aria-sort=descending] .sortb{color:var(--gold)}
tr[data-hc],tr[data-hw]{cursor:help}tr[data-hc]:hover td,tr[data-hw]:hover td{background:rgba(201,162,39,.12)}
#hoverCard{position:fixed;z-index:60;display:none;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.wprev{width:240px;background:var(--card);color:var(--cardink);border:2px solid #cfc6b4;border-left:6px solid var(--W);border-radius:10px;padding:10px 12px}
.wprev .wtop{display:flex;align-items:center;gap:8px}.wprev .wn{font-family:'Yatra One',serif;font-weight:700;font-size:16px}.wprev .wtx{font-size:13px;line-height:1.35;margin:8px 0}
.wprev .slots{display:flex;gap:6px}.pvslot{border:none!important;background:none!important;width:auto!important;height:auto!important}.wprev .slot{width:30px;height:30px;border-radius:50%;border:1.5px dashed #8a7a5c;display:grid;place-items:center;font-weight:700;font-size:13px;color:#2b2118;background:#fffaf0}
.edit input{width:64px;min-height:32px;padding:2px 6px;font-size:14px;background:#fffaf0;color:#2b2118;border:1px solid #b9a27a;color-scheme:light}
@media(prefers-reduced-motion:no-preference){.cell.legal{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{background:color-mix(in srgb,var(--gold) 30%,var(--panel2))}}}

/* Accueil simple */
.home{max-width:620px;margin:8px auto 22px;text-align:center;display:flex;flex-direction:column;align-items:center}
.home-wheel{width:clamp(120px,22vw,170px);height:auto;border-radius:50%;box-shadow:0 6px 22px rgba(60,40,10,.25)}
.home .logo{font-family:'Yatra One',serif;font-size:clamp(38px,7vw,64px);line-height:1.1;color:var(--brown);margin:.15em 0 0;letter-spacing:.03em}
.home .lead{font-size:clamp(16px,2vw,19px);margin:.3em 0 .4em;max-width:30em}

/* Tutoriel */

/* ===== Habillage « Temple au soleil » : safran, ocre, laque rouge, lotus et nuages en filigrane, drapeaux de prière ===== */
:root{--bg:light-dark(#f2d595,#22100c);--panel:light-dark(#fff4dc,#36190f);--panel2:light-dark(#fbe6bc,#45221a);
--ink:light-dark(#3a1a0e,#f6e4c4);--mute:light-dark(#7a4f2c,#cfa979);--line:light-dark(#e0b264,#6e3d24);--brown:light-dark(#8e1b1f,#f2c46a);

--tex:url(img/filigrane.svg),radial-gradient(ellipse 70% 55% at 50% -8%,rgba(255,246,210,.95),rgba(255,226,150,.35) 45%,transparent 70%),repeating-conic-gradient(from 0deg at 50% -10%,rgba(255,255,255,.07) 0 4deg,transparent 4deg 9deg)}

header::after{content:"";position:absolute;left:0;right:0;top:100%;height:26px;margin-top:1px;background:url(img/drapeaux.svg) repeat-x center top/150px 26px;pointer-events:none}
header h1{color:var(--or);text-shadow:0 2px 0 rgba(60,10,5,.45)}

.panel,.home-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px color-mix(in srgb,var(--or) 55%,transparent),0 6px 16px -10px rgba(110,40,10,.45)}
.panel>h3:first-child,.panel>h2:first-child{display:flex;align-items:center;gap:8px}

button.pri,.home .big,.cta{background:linear-gradient(180deg,#b3302f,var(--laque) 60%,var(--laque2));color:#fff3d6;border:1px solid var(--or);box-shadow:inset 0 1px 0 rgba(255,220,150,.45),0 2px 0 rgba(80,15,10,.35);border-radius:999px}
button.pri:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(180deg,#b3302f,var(--laque) 60%,var(--laque2))}
.home .big{font-family:'Yatra One',serif;font-weight:400;font-size:22px;letter-spacing:.03em}
.tutoBtn{border-radius:999px;background:linear-gradient(180deg,#fff4d6,#f8dc9a);border-color:var(--or);color:var(--laque2)}

.seat{background:var(--panel2)}

th{color:var(--brown);font-family:'Yatra One',serif;font-weight:400}

/* Tutoriel thématique : rouleau de parchemin entre deux baguettes laquées, le vieux moine guide, progression en perles de mala */
#tutoBubble{padding:0;border:none;background:none;box-shadow:none;width:min(410px,calc(100vw - 36px));filter:drop-shadow(0 12px 22px rgba(80,25,5,.4))}
#tutoBubble .tb-roll{height:14px;margin:0 -8px;border-radius:7px;background:linear-gradient(180deg,#c9443a,#9b2226 45%,#5e0f12);border:1px solid #3d0a0b;position:relative}
#tutoBubble .tb-roll::before,#tutoBubble .tb-roll::after{content:"";position:absolute;top:-3px;width:12px;height:18px;border-radius:4px;background:linear-gradient(180deg,#f7d77a,#c9971f);border:1px solid #7a5a10}
#tutoBubble .tb-roll::before{left:-6px}#tutoBubble .tb-roll::after{right:-6px}

#tutoBubble .tb-head{display:flex;align-items:center;gap:10px}

#tutoBubble .tb-monk{width:54px;height:54px;flex:none}
#tutoBubble p{position:relative;margin:.6em 0 .6em;font-size:14.5px;line-height:1.5;background:rgba(255,255,255,.55);border:1px solid #ecc77a;border-radius:12px;padding:8px 11px}
#tutoBubble p::before{content:"";position:absolute;left:20px;top:-8px;width:14px;height:14px;background:#fffaf0;border-left:1px solid #ecc77a;border-top:1px solid #ecc77a;transform:rotate(45deg)}
#tutoBubble .tb-mala{display:flex;justify-content:center;gap:4px;margin:2px 0 10px;position:relative}
#tutoBubble .tb-mala::before{content:"";position:absolute;left:6%;right:6%;top:50%;border-top:1px solid #b07a3c}
#tutoBubble .tb-mala i{position:relative;width:11px;height:11px;border-radius:50%;background:#f3dfb4;border:1px solid #b07a3c}
#tutoBubble .tb-mala i.on{background:radial-gradient(circle at 35% 30%,#d9783a,#8a3a12);border-color:#5a2208}
#tutoBubble .tb-mala i.now{background:radial-gradient(circle at 35% 30%,#ffe08a,#c9971f);border-color:#7a5a10;transform:scale(1.35)}
#tutoBubble .ghost{color:#8a5a30}

#leaveDlg{position:fixed;inset:0;z-index:90;background:rgba(40,12,5,.45);display:grid;place-items:center;padding:16px}

#leaveDlg .tb-roll::before,#leaveDlg .tb-roll::after{content:"";position:absolute;top:-3px;width:12px;height:18px;border-radius:4px;background:linear-gradient(180deg,#f7d77a,#c9971f);border:1px solid #7a5a10}
#leaveDlg .tb-roll::before{left:-6px}#leaveDlg .tb-roll::after{right:-6px}

.gcard{position:relative;overflow:hidden}

/* Rappel de la roue à côté du marché, qui reste visible en faisant défiler les cartes */

.mk-peek{position:sticky;top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;box-shadow:inset 0 0 0 3px var(--panel2),inset 0 0 0 4px color-mix(in srgb,var(--or) 50%,transparent)}
.mk-peek .wheel{max-width:150px}
.mk-h{font-family:'Yatra One',serif;color:var(--brown);font-size:14px;line-height:1.2;margin-bottom:2px}
.mk-st{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:4px 0;font-size:12.5px}.mk-st .chip{padding:1px 8px}

@media(max-width:700px){.mk-wrap{grid-template-columns:minmax(0,1fr)}.mk-peek{position:static;display:grid;grid-template-columns:110px 1fr;align-items:center;text-align:left}.mk-peek .mk-h{grid-column:1/-1}.mk-peek .wheel{max-width:110px;grid-row:span 2}}

/* ===== Dominante beige neutre, plus reposante pour les yeux ===== */

<script>
{
const E = window.Empires;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SEATS = [{ n: 'Noir', c: '#2b2b2b' }, { n: 'Blanc', c: '#f4f1ea' }, { n: 'Rose', c: '#d63384' }, { n: 'Turquoise', c: '#0fa3a3' }];

const TAGICON = { P: 'prosperite', M: 'devotion', S: 'connaissance', C: 'arts' };
const TAGC = { P: 'var(--P)', M: 'var(--M)', S: 'var(--S)', C: 'var(--C)', J: 'var(--J)' };
// Les âmes ont la forme d'une flamme ; les pions des joueurs gardent la forme d'un personnage.
const FLAME = 'M10.6 1.2c.5 2.6 2.4 4.3 4 6.2 1.5 1.8 2.6 3.7 2.6 6.2 0 4.3-3.3 7.4-7.2 7.4S2.8 17.9 2.8 13.6c0-2.6 1.2-4.6 2.7-6.2.3 1.6 1 2.8 2.2 3.4-.3-3.6.8-6.9 2.9-9.6z';
const MEEPLE = 'M10 1c2.6 0 4.3 1.9 4.3 4.2 0 1.3-.5 2.4-1.4 3.2l5.2 1.9c1.2.4 1.6 1.8.9 2.8-.5.6-1.3.8-2 .5l-2.7-1 3 6.2c.4.9-.2 1.9-1.2 1.9h-3.2L10 15.9l-2.9 4.8H3.9c-1 0-1.6-1-1.2-1.9l3-6.2-2.7 1c-.7.3-1.5.1-2-.5-.7-1-.3-2.4.9-2.8l5.2-1.9C6.2 7.6 5.7 6.5 5.7 5.2 5.7 2.9 7.4 1 10 1z';

let view = 'jouer';
let db = null, user = null, me = null, canWrite = null, backend = null;
let overrides = {};
let G = null, mode = null; // mode: 'local' | 'online'
let seats = [];            // [{bot, uid, label}]

let payMode = 'exact';
let online = { id: null, unsub: null, rev: 0, doc: null, writing: Promise.resolve() };
let lobby = [], names = {};
let botTimer = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Illustration simple d'une œuvre ---------- */
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function art(card, h = 74) {
  if (window.SCENES && SCENES[card.id]) return `<svg class="art" viewBox="0 0 186 74" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${SCENES[card.id]()}</svg>`;
  const r = hash(card.name), main = Object.keys(card.t).sort((a, b) => card.t[b] - card.t[a])[0] || 'X';
  const col = { P: '#d98e04', M: '#b3261e', S: '#2e7d5b', C: '#2b5aa8', J: '#8a8a8a', X: '#7a6a55' }[main];
  const sky = { P: '#f7e6c4', M: '#f3d9d2', S: '#d9ecdf', C: '#d8e2f3', J: '#e6e2da', X: '#efe5d2' }[main];
  const wall = '#f3ead7', dark = '#4a3524', W = 186;
  const cx = 93 + ((r % 21) - 10), wv = (r >> 5) % 3;
  // toit aux bords relevés
  const roof = (x, y, w, t, c = col) => `<path d="M${x - 8} ${y + 2} Q${x + w * .12} ${y} ${x + w * .2} ${y - t} L${x + w * .8} ${y - t} Q${x + w * .88} ${y} ${x + w + 8} ${y + 2} Q${x + w / 2} ${y - 3} ${x - 8} ${y + 2}Z" fill="${c}" stroke="${dark}" stroke-width="1.2"/>`;
  const mount = `<path d="M0 ${h - 10} L${30 + wv * 8} ${h - 34} L${62} ${h - 18} L${110} ${h - 40} L${150} ${h - 20} L${186} ${h - 30} V${h} H0Z" fill="${col}" opacity=".12"/>`;
  const ground = `<rect x="0" y="${h - 10}" width="${W}" height="10" fill="#c9b58e"/>`;
  let b = '';
  if (main === 'P') { // maison de village et rizière
    const w = 60 + wv * 10, x = cx - w / 2, y = h - 34;
    b = `${[0, 1, 2].map(i => `<path d="M0 ${h - 10 - i * 5} H${40 - i * 8}" stroke="#8fb36a" stroke-width="3"/><path d="M${186 - 40 + i * 8} ${h - 10 - i * 5} H186" stroke="#8fb36a" stroke-width="3"/>`).join('')}
      <rect x="${x}" y="${y}" width="${w}" height="24" fill="${wall}" stroke="${dark}"/>${roof(x, y, w, 14)}
      <rect x="${cx - 7}" y="${y + 8}" width="14" height="16" fill="${dark}"/><rect x="${x + 7}" y="${y + 7}" width="9" height="8" fill="${col}" opacity=".7"/><rect x="${x + w - 16}" y="${y + 7}" width="9" height="8" fill="${col}" opacity=".7"/>`;
  } else if (main === 'M') { // pagode à étages
    const n = 3 + (wv > 1 ? 1 : 0); let y = h - 10, ww = 58;
    for (let i = 0; i < n; i++) { const hh = 14 - i; b += `<rect x="${cx - ww / 2 + 6}" y="${y - hh}" width="${ww - 12}" height="${hh}" fill="${wall}" stroke="${dark}"/>${roof(cx - ww / 2, y - hh, ww, 6)}`; y -= hh + 6; ww -= 10; }
    b += `<path d="M${cx} ${y + 2} v-12" stroke="${dark}" stroke-width="2"/><circle cx="${cx}" cy="${y - 11}" r="2.5" fill="#c9a227"/>`;
  } else if (main === 'S') { // pavillon des rouleaux, fenêtre ronde
    const w = 70 + wv * 8, x = cx - w / 2, y = h - 36;
    b = `<rect x="${x - 4}" y="${h - 14}" width="${w + 8}" height="4" fill="${wall}" stroke="${dark}"/>
      <rect x="${x}" y="${y}" width="${w}" height="22" fill="${wall}" stroke="${dark}"/>${roof(x, y, w, 12)}${roof(x + w * .2, y - 12, w * .6, 9)}
      <circle cx="${cx}" cy="${y + 11}" r="7" fill="${dark}"/><circle cx="${cx}" cy="${y + 11}" r="4.5" fill="${col}" opacity=".6"/>
      ${[-1, 1].map(s => `<rect x="${cx + s * (w / 2 - 12) - 3}" y="${y + 4}" width="6" height="14" fill="${col}" opacity=".7"/>`).join('')}`;
  } else if (main === 'C') { // portique sacré, cloche et lanternes
    const w = 74 + wv * 6, x = cx - w / 2, y = h - 44;
    b = `${[0, 1].map(i => `<rect x="${x + 8 + i * (w - 24)}" y="${y}" width="8" height="${h - 10 - y}" fill="${col}" stroke="${dark}"/>`).join('')}
      <rect x="${x + 2}" y="${y + 8}" width="${w - 4}" height="5" fill="${col}" stroke="${dark}"/>${roof(x, y, w, 7, dark)}
      <path d="M${cx} ${y + 13} v5" stroke="${dark}" stroke-width="1.5"/><path d="M${cx - 6} ${y + 30} q0-12 6-12 q6 0 6 12z" fill="#c9a227" stroke="${dark}"/>
      ${[-1, 1].map(s => `<ellipse cx="${cx + s * (w / 2 + 14)}" cy="${h - 26}" rx="5" ry="7" fill="#e85d3f" stroke="${dark}"/><path d="M${cx + s * (w / 2 + 14)} ${h - 19} v9" stroke="${dark}"/>`).join('')}`;
  } else { // lanterne de pierre
    const x = cx;
    b = `<rect x="${x - 4}" y="${h - 30}" width="8" height="20" fill="${wall}" stroke="${dark}"/><rect x="${x - 12}" y="${h - 34}" width="24" height="5" fill="${wall}" stroke="${dark}"/>
      <rect x="${x - 9}" y="${h - 46}" width="18" height="12" fill="${wall}" stroke="${dark}"/><rect x="${x - 4}" y="${h - 43}" width="8" height="6" fill="#f2b84b"/>${roof(x - 12, h - 46, 24, 7, '#8a7a62')}`;
  }
  const extra = Object.keys(card.t).filter(k => k !== main && k !== 'J');
  const badges = extra.map((k, i) => `<circle cx="${18 + i * 14}" cy="16" r="5" fill="${TAGC[k].replace(/var\(--(\w)\)/, (m, t) => ({ P: '#d98e04', M: '#b3261e', S: '#2e7d5b', C: '#2b5aa8' }[t]))}"/>`).join('');
  return `<svg class="art" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${h}" fill="${sky}"/>${mount}${ground}${b}${badges}</svg>`;
}
// Âges de l'âme : jeune (1-2), mûre (3-4), ancienne (5) ; les cadres des œuvres en découlent
const AGES = {
  br: { label: 'Jeunesse', img: 'age1.svg', bg: '#d5ebc0', txt: 'Uniquement des jeunes âmes (niveaux 1-2).' },
  ag: { label: 'Maturité', img: 'age2.svg', bg: '#f7d796', txt: 'Au moins une âme mûre (niveau 3 ou plus).' },
  or: { label: 'Sagesse', img: 'age3.svg', bg: '#f1e2a8', txt: 'Au moins une âme ancienne (niveau 5).' },
};
function tagsHTML(t) {
  const out = [];
  const ICON = TAGICON;
  for (const k of ['P', 'M', 'S', 'C', 'J']) for (let i = 0; i < (t[k] || 0); i++) out.push(ICON[k] ? `<img class="tagi" src="img/${ICON[k]}.svg" alt="${esc(E.TAG_NAMES[k])}" title="${esc(E.TAG_NAMES[k])}">` : `<span class="tag" style="background:${TAGC[k]}" title="Joker">★</span>`);
  return `<div class="tags">${out.join('')}</div>`;
}
function costHTML(card, cost) {
  const levels = (G ? G.opts.costMode : costModeSim()) === 'levels';
  if (levels && Array.isArray(cost ?? card.c)) return `<div class="cost">${(cost ?? card.c).map(l => meepleNum(l)).join('')}</div>`;
  const v = cost ?? E.cardValue(card);
  const col = card.f === 'or' ? '#a88a1c' : card.f === 'ag' ? '#c27a12' : card.f === 'br' ? '#4f8a33' : '#5b4a36';
  return `<div class="cost" title="Coût : somme des niveaux des âmes dépensées${card.f ? (card.f === 'or' ? ' — œuvre de sage : dont une âme ancienne (niveau 5)' : card.f === 'br' ? ' — œuvre de jeunesse : uniquement des jeunes âmes (niveaux 1-2)' : ' — œuvre de maturité : dont une âme mûre (niveau 3 ou plus)') : ''}">${meepleNum(v, col)}</div>`;
}
// Remplace dans les textes d'effet les mots qui ont un icône : tags, PV, Karma, autels
const TAGW = { 'Prospérité': 'P', 'Dévotion': 'M', 'Connaissance': 'S', 'Arts': 'C' };
function tagImg(k) { return `<img class="ti" src="img/${TAGICON[k]}.svg" alt="${E.TAG_NAMES[k]}" title="${E.TAG_NAMES[k]}">`; }
// Sur les tuiles Sanctuaire, les PV par rang sont déjà sur les cases : le texte commence par un lotus sans chiffre
function wonderShort(W) { const t = E.wonderText(W), m = t.match(/^\d+ \/ \d+ \/ \d+ PV\s*/); return m ? `<span class="pv sm" title="${esc(W.vals.join(' / '))} PV"></span>` + iconize(t.slice(m[0].length)) : iconize(t); }
function iconize(raw) {
  // Chaque icône est mis de côté sous un jeton, pour que les remplacements suivants ne touchent pas à ses attributs (alt, title)
  const keep = [], tok = html => { keep.push(html); return `\u0001${keep.length - 1}\u0002`; };
  let s = esc(raw);
  s = s.replace(/(?:l’|l')?Autel (?:du Karma|de la Vie|de l’Enseignement|de l'Enseignement)/g, m => { const g = /Karma/.test(m) ? 'eru' : /Vie/.test(m) ? 'mar' : 'art'; return tok(`<img class="ti" src="img/${g}.svg" alt="${E.ALTAR[g]}" title="${E.ALTAR[g]}">`); });
  s = s.replace(/1 tag de chaque type/g, () => tok(['P', 'M', 'S', 'C'].map(tagImg).join('')));
  s = s.replace(/\btags? (Prospérité|Dévotion|Connaissance|Arts)/g, (m, w) => tok(tagImg(TAGW[w])));
  s = s.replace(/(Prospérité|Dévotion|Connaissance|Arts)(?![\wÀ-ÿ])/g, (m, w) => tok(tagImg(TAGW[w])));
  s = s.replace(/(\d+(?: \/ \d+)*) PV/g, (m, ns) => tok(ns.split(' / ').map(n => pvIcon(n, 'sm')).join('<span class="mute">/</span>')));
  s = s.replace(/(\d+|X) Karma/g, (m, n) => tok(karmaIco(n, 18)));
  return s.replace(/\u0001(\d+)\u0002/g, (m, k) => keep[+k]);
}
// Pictogrammes des bénédictions : âme gagnée (flamme chiffrée), amélioration (flamme + flèche), Karma (jeton)
const AGECOL = l => l >= 5 ? '#b8961f' : l >= 3 ? '#c27a12' : l >= 1 ? '#4f8a33' : '#7a6650';
function soulIco(l, s = 30) { return `<svg class="bico" width="${s}" height="${s * 1.1}" viewBox="0 0 20 22" role="img" aria-label="Âme de niveau ${l}"><path d="${FLAME}" fill="${AGECOL(l)}" stroke="#3a2e1f" stroke-width=".8"/><text x="10" y="17.6" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">${l}</text></svg>`; }
function upIco(n, s = 30) { return `<span class="bgrp" role="img" aria-label="${n} niveau${n > 1 ? 'x' : ''} d’amélioration"><svg class="bico" width="${s}" height="${s * 1.3}" viewBox="0 0 20 26"><path d="M10 0.6l5 5.2h-3v3.4H8V5.8H5z" fill="#2e7d5b"/><g transform="translate(0 4.4)"><path d="${FLAME}" fill="${WOOD}" stroke="#3a2e1f" stroke-width=".8"/><text x="10" y="17.6" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">${n}</text></g></svg></span>`; }
function karmaIco(n, s = 30) { return `<svg class="bico" width="${s}" height="${s}" viewBox="0 0 24 24" role="img" aria-label="${n} Karma"><circle cx="12" cy="12" r="11.4" fill="#5a3592" stroke="#2a1a45" stroke-width=".8"/><circle cx="12" cy="12" r="9.9" fill="none" stroke="#d9c4ff" stroke-width=".9" stroke-dasharray="1.4 1.6"/><text x="12" y="16.9" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-size="${String(n).length > 1 ? 11.5 : 14.5}" font-weight="800" fill="#fff">${n}</text></svg>`; }
const TURNICO = `<svg class="bico" width="22" height="22" viewBox="0 0 24 24" role="img" aria-label="La roue tourne"><circle cx="12" cy="12" r="11" fill="#5b4a36"/><path d="M17.5 12a5.5 5.5 0 1 1-1.8-4.1" fill="none" stroke="#f4d98a" stroke-width="2.2" stroke-linecap="round"/><path d="M17.8 4.6v4.6h-4.6z" fill="#f4d98a"/></svg>`;
function jokerIco(g, k, s) { if (g === 'mar') return soulIco(Math.max(0, Math.min(5, k - 2)), s); return k - 1 > 0 ? blessIco(g, k - 1, s) : `<span class="mute" style="font-size:${Math.round(s * .6)}px">∅</span>`; }
function blessIco(g, k, s) { return g === 'mar' ? soulIco(Math.min(5, k - 1), s) : g === 'art' ? upIco(k, s) : karmaIco(k, s); }
function meepleNum(v, color = '#5b4a36', stroke = '') { return `<div class="mcost"><svg viewBox="0 0 20 22"><path d="${FLAME}" fill="${color}"/></svg><span>${esc(v)}</span></div>`; }
// Icône de points de victoire : laurier avec la valeur en vert
function pvIcon(v, cls = '') {
  if (String(v).includes(',')) return `<span class="pvi pvd" aria-label="${v} PV"><span class="pv sm" aria-hidden="true"></span>${v}</span>`; // valeur décimale : trop large pour le laurier
  return `<span class="pv ${cls}" title="${v} PV" aria-label="${v} PV">${v}</span>`;
}
function cardHTML(card, o = {}) {
  const tx = E.cardText(card);
  const fx = [];
  // le prérequis n'est pas répété dans le texte : ses icônes sont à côté du coût
  if (tx.sx) fx.push(`<div><b class="k-sx">Sacrifice</b>${iconize(tx.sx)}</div>`);
  if (tx.gd) fx.push(`<div><b class="k-gd">Autel −1</b>${iconize(tx.gd)}</div>`);
  if (tx.imm) fx.push(`<div><b class="k-imm">Immédiat</b>${iconize(tx.imm)}</div>`);
  if (tx.act) fx.push(`<div><b class="k-act">Activation</b>${iconize(tx.act)}</div>`);
  if (tx.perm) fx.push(`<div><b class="k-perm">Permanent</b>${iconize(tx.perm)}</div>`);
  if (tx.end) fx.push(`<div><b class="k-end">Fin</b>${iconize(tx.end)}</div>`);
  const gi = card.g ? `<img class="gicon" src="img/${card.g}.svg" alt="${esc(E.GUILD_NAMES[card.g])}" title="Réduction d’autel : ${esc(E.ALTAR[card.g])}${card.g === 'voy' ? ' (joker : rangée au choix)' : ''}">` : '';
  const sumMode = (G ? G.opts.costMode : costModeSim()) !== 'levels';
  const fr = sumMode && card.f ? card.f : '';
  // Âge exigé : affiché une seule fois, dans le bandeau du haut sous le coût (en rouge s'il manque)
  const ageMiss = o.can && !o.can.ok && o.can.age;
  const AGESHORT = { br: 'jeunes âmes seulement (1-2)', ag: 'une âme mûre (3+)', or: 'une âme ancienne (5)' };
  const ageBar = fr ? `<div class="agebar ${ageMiss ? 'miss' : ''}" style="background:${AGES[fr].bg}" title="${esc(AGES[fr].txt)}"><img src="img/${AGES[fr].img}" alt=""><span><b>${AGES[fr].label}</b> · ${AGESHORT[fr]}${ageMiss ? ' : manquante' : ''}</span></div>` : '';
  // Zone de coût (haut gauche) : coût + prérequis + réduction de guilde. Zone d'apport (bas droite) : tags fournis + PV.
  const ICON = TAGICON;
  const reqI = [];
  if (card.req && (!G || G.opts.prereqs !== false)) {
    if (card.req.wonder) reqI.push(`<img src="img/sanctuaire.svg" alt="Sanctuaire" title="Avoir au moins 1 âme sur un Sanctuaire">`);
    else if (card.req.tags.all) ['P', 'M', 'S', 'C'].forEach(k => reqI.push(`<img src="img/${ICON[k]}.svg" alt="${E.TAG_NAMES[k]}" title="1 tag de chaque type">`));
    else Object.entries(card.req.tags).forEach(([k, n]) => { for (let i = 0; i < n; i++) reqI.push(`<img src="img/${ICON[k]}.svg" alt="${E.TAG_NAMES[k]}" title="Prérequis : ${E.TAG_NAMES[k]}">`); });
  }
  const gdI = card.gd && card.g !== 'voy' ? `<span class="czgd" title="−1 par offrande sur votre ${esc(E.ALTAR[card.g])}">−<img src="img/${card.g}.svg" alt="${esc(E.GUILD_NAMES[card.g])}"></span>` : '';
  const costZone = `<div class="cz">${costHTML(card, o.cost)}${reqI.length ? `<span class="czreq" title="Prérequis">${reqI.join('')}</span>` : ''}${gdI}</div>`;
  const giveZone = `<div class="gz">${card.pv ? pvIcon(card.pv, 'big') : ''}</div>`, tagZone = `<div class="hdtags">${tagsHTML(card.t)}</div>`;
  return `<div data-tip="${card.id}" class="card ${o.sel ? 'sel' : ''} ${o.click ? 'click' : ''} ${o.locked ? 'locked' : ''} ${o.can ? (o.can.ok ? 'can' : 'cant') : ''} ${fr ? 'f-' + fr : ''}" ${o.attrs || ''}>
    <div class="hd">${costZone}<span class="nm">${esc(card.name)}</span></div>${ageBar}${o.can ? (o.can.ok ? `<div class="canmsg ${o.can.byp ? 'byp' : ''}">✔ Réalisable${o.can.byp ? ` avec ${o.can.bypCost} Karma (${o.can.byp})` : ''}</div>` : o.can.age ? '' : `<div class="lockmsg">${esc(o.can.why)}</div>`) : o.locked ? '<div class="lockmsg">Prérequis non rempli</div>' : ''}
    ${art(card)}
    <div class="fx">${fx.join('')}</div>
    <div class="ft ft3"><div class="ftt">${tagsHTML(card.t)}</div><span class="lv">Niv. ${card.lvl}</span><div class="ftp">${card.pv ? pvIcon(card.pv, 'big') : ''}</div></div>${o.extra || ''}</div>`;
}

/* ---------- Roue ---------- */
function wheelSVG(p, color, opts = {}) {
  // Même langage que les cartes : parchemin, encre brune, badges meeple chiffrés, or pour les points, violet Sanctuaire
  const cx = 150, cy = 150, R = 116, ink = '#5b4a36', o = [];
  const fills = ['#e9e1cd', '#d3e7bb', '#d3e7bb', '#f3d495', '#f3d495', '#f6efd8']; // 1-2 jeunes âmes · 3-4 âmes mûres · 5 âme ancienne
  const pt = (r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const f = n => n.toFixed(1);
  o.push(`<defs>
    <pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${fills[0]}"/><line x1="0" y1="0" x2="0" y2="6" stroke="#cfc3a8" stroke-width="2"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#7a5f3a" stop-opacity=".18"/></radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="${ink}"/></marker></defs>`);
  // anneau extérieur façon bord de carte
  o.push(`<circle cx="${cx}" cy="${cy}" r="${R + 16}" fill="#d8c49b" stroke="${ink}" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="${R + 9}" fill="none" stroke="#8a7350" stroke-width="1" stroke-dasharray="2 4"/>`);
  for (let i = 0; i < 6; i++) {
    const c = 180 + 60 * i, [x0, y0] = pt(R, c - 30), [x1, y1] = pt(R, c + 30);
    const pick = opts.pick && p.wheel[i] > 0;
    o.push(`<path d="M${cx} ${cy} L${f(x0)} ${f(y0)} A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)} Z" fill="${i === 0 ? 'url(#hz)' : fills[i]}" stroke="${pick ? '#c9a227' : ink}" stroke-width="${pick ? 4 : 2}" ${pick ? `data-lvl="${i}" style="cursor:pointer" tabindex="0" role="button" aria-label="Choisir une âme de niveau ${i}"` : ''}/>`);
    // âmes rangées sur deux arcs
    const n = p.wheel[i], slots = [[52, -16], [52, 16], [86, -18], [86, 0], [86, 18], [52, 0]];
    for (let k = 0; k < Math.min(n, 6); k++) {

function collectOverrides() {
  const ov = JSON.parse(JSON.stringify(overrides)); ov.cards = ov.cards || {}; ov.wonders = ov.wonders || {};
  document.querySelectorAll('[data-ov]').forEach(inp => {
    const [id, k] = inp.dataset.ov.split(':'); const base = E.BASE_CARDS.find(b => b.id === id);
    let val = k === 'c' ? inp.value.split(',').map(x => Math.max(0, Math.min(5, +x || 0))).filter((x, i, a) => a.length) : Math.max(0, +inp.value || 0);
    const baseVal = k === 'v' ? (base.v != null ? base.v : base.c.reduce((a, b) => a + b, 0)) : base[k];
    const o = ov.cards[id] = ov.cards[id] || {};
    if (JSON.stringify(val) === JSON.stringify(baseVal)) delete o[k]; else o[k] = val;
    if (!Object.keys(o).length) delete ov.cards[id];
  });
  document.querySelectorAll('[data-wov]').forEach(inp => {
    const id = inp.dataset.wov, base = E.BASE_WONDERS.find(b => b.id === id);
    const vals = inp.value.split(',').map(x => +x || 0).slice(0, 3); while (vals.length < 3) vals.push(0);
    if (JSON.stringify(vals) === JSON.stringify(base.vals)) delete ov.wonders[id]; else ov.wonders[id] = { vals };
  });
  return ov;
}

// Ajoute l'icône devant chaque élément du jeu cité dans les règles (une fois par paragraphe), hors figures et tableaux
function rulesIcons(html) {
  const img = (f, alt) => `<img class="rti" src="img/${f}.svg" alt="${alt}">`;
  const tag = k => img(TAGICON[k], E.TAG_NAMES[k]);
  const R = [
    [/Autel de la Vie/, img('mar', '')], [/Autel de l’Enseignement/, img('art', '')], [/Autel du Karma/, img('eru', '')], [/Moine errant/, img('voy', '')],
    [/Sanctuaires?/, img('sanctuaire', '')], [/Éveil/, img('eveil', '')], [/(?<!Autel du )Karma/, karmaIco('', 15)],
    [/Prospérité/, tag('P')], [/Dévotion/, tag('M')], [/Connaissance/, tag('S')], [/(?<![\wÀ-ÿ])Arts(?![\wÀ-ÿ])/, tag('C')],
    [/(?<![\wÀ-ÿ])âmes?(?![\wÀ-ÿ])/, `<svg class="rti" viewBox="0 0 20 22"><path d="${FLAME}" fill="${WOOD}" stroke="#3a2e1f" stroke-width=".8"/></svg>`],
    [/(?<![\wÀ-ÿ])PV(?![\wÀ-ÿ])/, img('pv', '')], [/offrandes?/, '<svg class="rti" viewBox="0 0 16 20"><rect x="1.5" y="1" width="13" height="18" rx="2.5" fill="#fffaf0" stroke="#b98a4a" stroke-width="1.6"/><rect x="4" y="5" width="8" height="8" rx="1.6" fill="#c9a96a"/></svg>'],
    [/[Tt]ourn(?:ez|e) (?:votre|sa|la) roue/, TURNICO.replace('width="22" height="22"', 'width="15" height="15"').replace('class="bico"', 'class="rti"')],
  ];
  let skip = 0, seen = new Set();
  return html.split(/(<[^>]+>)/).map(seg => {
    if (seg.startsWith('<')) {
      if (/^<(figure|table|h2|h3)[\s>]/.test(seg)) skip++;
      else if (/^<\/(figure|table|h2|h3)>/.test(seg)) skip = Math.max(0, skip - 1);
      if (/^<(p|li)[\s>]/.test(seg)) seen = new Set();
      return seg;
    }
    if (skip || !seg.trim()) return seg;
    for (const [re, ico] of R) {
      if (seen.has(re.source)) continue;
      const m = seg.match(re); if (!m) continue;
      seen.add(re.source); seg = seg.slice(0, m.index) + `\u0001${R.findIndex(r => r[0] === re)}\u0002` + seg.slice(m.index);
    }
    return seg.replace(/\u0001(\d+)\u0002/g, (x, i) => R[+i][1]);
  }).join('');
}

  <div class="scroll"><table><thead><tr><th>Offrande n°</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th><th class="n">5</th><th class="n">6 et plus</th></tr></thead><tbody>
  <tr><td><strong>Autel de la Vie</strong> : une âme s’incarne au niveau…</td><td class="n">0</td><td class="n">1</td><td class="n">2</td><td class="n">3</td><td class="n">4</td><td class="n">5</td></tr>
  <tr><td><strong>Autel de l’Enseignement</strong> : niveaux à répartir entre vos âmes</td><td class="n">1</td><td class="n">2</td><td class="n">3</td><td class="n">4</td><td class="n">5</td><td class="n">6, 7…</td></tr>
  <tr><td><strong>Autel du Karma</strong> : Karma gagné</td><td class="n">1</td><td class="n">2</td><td class="n">3</td><td class="n">4</td><td class="n">5</td><td class="n">6, 7…</td></tr></tbody></table></div>
  <p><strong>L’équilibre.</strong> Dès qu’une colonne contient une offrande sur chaque autel (votre 1re offrande sur chacun, puis votre 2e, etc.), <strong>votre roue tourne</strong>. Honorer un seul autel renforce ses bénédictions ; honorer les trois fait tourner la roue.</p>
  <p><strong>Moine errant (joker).</strong> Il dépose son offrande sur l’autel de votre choix, mais sa bénédiction vaut un cran de moins que la case (Vie : une âme d’un niveau de moins ; Enseignement et Karma : 1 de moins). Il compte normalement pour l’équilibre des colonnes.</p>
  <p><strong>Karma.</strong> Il se cumule. Il se dépense <strong>toujours par 2</strong>. <strong>2 Karma</strong> réduisent de 1 le coût d’une œuvre (utilisés automatiquement). <strong>2 Karma</strong> permettent aussi d’ignorer <em>un</em> élément de prérequis d’une œuvre : un tag manquant, l’âme sur un Sanctuaire qui manque, ou l’âge exigé (on peut en ignorer plusieurs : 2 Karma chacun). Le Karma ne vaut aucun point, sauf effet de carte.</p>
  <p><strong>Âge exigé et réductions.</strong> Une œuvre de maturité coûte toujours au moins 3, une œuvre de sage au moins 5 : il faut de toute façon y dépenser cette âme. Les réductions (Karma, autels, effets) ne descendent pas en dessous ; le Karma en trop n’est pas dépensé.</p>
  <p>Vos autels servent aussi aux réductions d’autel et à certains scores (Réunir les fidèles, Commercer au port, Lumbini…). La première âme de l’Autel de la Vie s’incarne au niveau 0 : elle ne vient que s’il y a moins de 3 âmes dans votre case 0.</p>
  ${F.altars}
  <h3>Accomplir une œuvre</h3>
  <p>Le coût est le chiffre en haut à gauche de la carte. Consacrez-y des âmes dont la somme des niveaux atteint ce chiffre ; une âme de niveau 0 n’apporte rien, et l’on ne peut pas ajouter d’âme inutile. <strong>Les âmes consacrées meurent et renaissent au niveau 0</strong> : on perd leur sagesse, pas les âmes elles-mêmes. Exception : les œuvres marquées <strong>Sacrifice</strong> (œuvres de sage) libèrent ces âmes : elles retournent dans votre réserve. Le Karma (2 pour −1), les réductions d’autel et certaines œuvres réduisent le coût.</p>
  ${F.card}
  <h3>Conditions sur les cartes</h3>
  <p><strong>Réduction d’autel</strong> (quelques œuvres) : 1 de moins par offrande sur l’autel indiqué, sans limite. <strong>Prérequis de tags</strong> (la plupart des œuvres de niveau 2) : avoir déjà ces tags dans son mandala ; le Joker ne compte pas. <strong>Prérequis Sanctuaire</strong> (les œuvres les plus fortes) : avoir au moins 1 âme sur un Sanctuaire. Une œuvre qui exige un âge (jeunesse, maturité, sagesse) n’a jamais de réduction d’autel : l’âge impose déjà le niveau des âmes à consacrer.</p>
  <p><strong>Les quatre tags</strong> ont chacun leur style : <strong>Prospérité</strong> fait grandir la lignée (de nouvelles âmes), <strong>Dévotion</strong> conduit à l’Éveil (âmes très avancées, âmes posées sur les Sanctuaires), <strong>Connaissance</strong> fait tourner le cycle (niveaux, roue, réductions, effets permanents), <strong>Arts</strong> embellit le mandala (lignes, colonnes, voisins, coins). Une œuvre porte un tag, deux fois le même, deux tags différents, aucun, ou très rarement les quatre (Unir le royaume).</p>
  <p><strong>Matériel</strong> : 48 œuvres de niveau 1 et 42 de niveau 2 (cartes carrées de 63 × 63 mm), 66 offrandes (41 × 63 mm) et 16 Sanctuaires. Si les offrandes ou la pioche de niveau 1 sont épuisées, la fin de partie est déclenchée.</p>
  <h3>Les âges de l’âme</h3>
  <p>La roue a trois âges : <strong>jeunes âmes</strong> (niveaux 1-2), <strong>âmes mûres</strong> (3-4) et <strong>âme ancienne</strong> (5). Certaines œuvres exigent un âge :</p>${F.ages}
  <ul><li><strong>Œuvre de jeunesse</strong> (cadre vert) : uniquement des jeunes âmes (Laver le linge au fleuve, Exercer les novices, Ouvrir une école, Peupler les faubourgs, Construire la maison commune).</li>
  <li><strong>Œuvre de maturité</strong> (cadre safran) : au moins une âme mûre ; plusieurs jeunes âmes ne suffisent pas.</li>
  <li><strong>Œuvre de sage</strong> (cadre doré) : au moins une âme ancienne. La plupart sont aussi des Sacrifices : l’âme ancienne quitte le cycle.</li></ul>
  <p>Le reste du coût se complète normalement. Avec 2 Karma, on peut ignorer l’âge exigé (2 Karma par élément de prérequis ignoré). Une âme ancienne est donc tiraillée : accomplir une œuvre de sage, ou atteindre l’Éveil.</p>
  <h3>Le mandala</h3>
  <p>Une grille de 3 × 3. La première œuvre se place n’importe où, les suivantes à côté d’une œuvre déjà accomplie. Le placement compte : certaines œuvres marquent selon leur ligne, leur colonne, leurs voisines ou leur position dans un coin, et « Débattre des écritures » redéclenche l’effet immédiat de ses voisines.</p>
  ${F.mandala}
  <h3>La roue et l’Éveil</h3>
  <p><strong>Un cycle continu.</strong> Une âme qui entre sur votre roue y reste. « Tournez votre roue » fait avancer toutes vos âmes d’une case. Une âme qui dépasse le niveau 5 atteint l’<strong>Éveil</strong> : elle <strong>rejoint aussitôt le Sanctuaire</strong> de votre choix (première place libre) et y reste ; elle sert de marqueur. Si toutes les places sont prises, elle retourne dans votre réserve. Une âme qui s’incarne au niveau 0 ne vient que s’il y a moins de 3 âmes dans votre case 0 ; une âme qui s’incarne plus haut n’a pas cette limite. Les âmes des œuvres Sacrifice retournent aussi dans votre réserve.</p>
  <p>Le Joker compte comme le type manquant pour « 1 tag de chaque type », et comme un type de plus pour « tags différents ».</p>
  ${F.wheel}
  <h3>Sanctuaires et fin de partie</h3>
  <p>Chaque Sanctuaire a 3 places de valeur décroissante ; les points sont comptés à l’arrivée de l’âme, avec vos tags à ce moment-là. Un joueur peut avoir plusieurs âmes sur le même Sanctuaire. La fin est déclenchée quand il y a <strong>3 âmes par joueur + 2</strong> sur les Sanctuaires (8 à 2 joueurs, 11 à 3, 14 à 4), ou quand un mandala compte 9 œuvres. On termine alors le tour de table. Égalité : le plus d’âmes sur la roue.</p>
  ${F.wonder}
<div class="devnote">
  <h3>Équilibrage</h3>
  <p>Réglé sur des parties simulées entre bots qui planifient leur tour : environ 8 à 9 tours et 6 à 7 œuvres par joueur, et une fin par les Sanctuaires dans environ une partie sur trois (les autres par un mandala achevé), à 2, 3 et 4 joueurs. Les trois autels sont honorés à parts à peu près égales.</p>
  <h3>Questions encore ouvertes</h3>
  <ul><li>Roue de départ (5 âmes : 2 au niveau 0, 2 au niveau 1, 1 au niveau 2).</li><li>Valeur des Sanctuaires, non réglés un par un.</li><li>Les bots jouent correctement mais pas comme des experts : tout est à confirmer en vraies parties.</li></ul>
</div>
  </section>`).replace('%%GLOSS%%', F.icons);
}

}
function sheetTables() { const T = E.exportTables(); T['Règles'] = rulesRows(); return T; }
window.sheetTables = sheetTables;
const SHEET_ID = '1rMHgc_mMu4IrVlTSeb0PP9M3aEuUYScOAv0xsXldzIo', SHEET_SERVER = 'Google Sheets';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';
let sheetSync = { state: 'idle', at: null, msg: '' }, syncing = false;
function hashStr(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) | 0; return String(h >>> 0); }
async function syncSheet(auto) {
  if (syncing) return; const c = window.claude; if (!c || !c.use) return;
  const mcp = await c.use('mcp');
  if (!mcp) { sheetSync = { state: 'off', msg: 'Synchronisation indisponible dans cette vue.' }; if (view === 'cartes') render(); return; }
  const T = sheetTables(), hash = hashStr(JSON.stringify(T));
  if (auto && db) { try { const s = await db.doc('config/sheet').get(); if (s.exists && s.data().hash === hash) { sheetSync = { state: 'ok', at: s.data().at, msg: '' }; if (view === 'cartes') render(); return; } } catch (e) { } }
  syncing = true; sheetSync = { state: 'busy', msg: '' }; if (view === 'cartes') render();
  try {
    for (const [tab, rows] of Object.entries(T)) {
      await mcp.callTool(SHEET_SERVER, 'batch_clear_values', { spreadsheetId: SHEET_ID, ranges: [`'${tab}'!A2:Z1000`] });
      await mcp.callTool(SHEET_SERVER, 'update_values', { spreadsheetId: SHEET_ID, range: `'${tab}'!A1`, values: rows });
    }
    const at = Date.now(); sheetSync = { state: 'ok', at, msg: '' };
    if (db) { try { await db.doc('config/sheet').set({ hash, at }); } catch (e) { } }
  } catch (e) {
    const fix = { needs_reauth: 'Reconnectez Google Sheets dans les réglages de claude.ai (Connecteurs).', server_not_connected: 'Ajoutez le connecteur Google Sheets dans les réglages de claude.ai (Connecteurs).', not_in_manifest: 'Vous avez refusé l’accès à Google Sheets pour cette page.', approval_required: 'La synchronisation attend votre autorisation : cliquez sur « Synchroniser maintenant ».', tool_error: 'Google Sheets a refusé l’écriture (droits sur le tableur ?).', selection_required: 'Choisissez quel connecteur Google Sheets utiliser.' }[e && e.code];
    sheetSync = { state: 'err', msg: fix || ('Synchronisation interrompue (' + ((e && e.code) || 'erreur') + ').') };
  }
  syncing = false; if (view === 'cartes') render();
}

  if (id === 'endTurn') return act({ type: 'end' });
});

  const dbA = { doc: path => { const r = fs.doc(path); r.acquire = async () => ({ acquired: true }); return r; }, collection: n => fs.collection(n) };
